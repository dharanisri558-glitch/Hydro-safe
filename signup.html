<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | HydroSafe</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="login-page">

    <div class="login-wrapper">

        <div class="login-card">

            <a href="index.html" class="login-logo">
                <img src="logo.jpeg" alt="HydroSafe">
                <h2>HydroSafe</h2>
            </a>

            <p class="login-label">GET STARTED</p>

            <h1>Create Your Account</h1>

            <p class="login-description">
                Create an account to explore HydroSafe's water analysis
                and purification guidance.
            </p>


            <!-- NAME -->

            <div class="login-input">

                <i class="fa-solid fa-user"></i>

                <input
                    type="text"
                    id="signupName"
                    placeholder="Full name"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="login-input">

                <i class="fa-solid fa-envelope"></i>

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Email address"
                    required
                >

            </div>

<!-- PASSWORD -->

<div class="login-input">

    <i class="fa-solid fa-lock"></i>

    <input
        type="password"
        id="signupPassword"
        placeholder="Password"
        required
    >

    <button
        type="button"
        class="password-toggle"
        data-target="signupPassword"
        aria-label="Show or hide password"
    >
        <i class="fa-solid fa-eye"></i>
    </button>

</div>

<!-- CONFIRM PASSWORD -->

<div class="login-input">

    <i class="fa-solid fa-lock"></i>

    <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm password"
        required
    >

    <button
        type="button"
        class="password-toggle"
        data-target="confirmPassword"
        aria-label="Show or hide password"
    >
        <i class="fa-solid fa-eye"></i>
    </button>

</div>


            <!-- SIGNUP BUTTON -->

            <button class="login-button" id="signupButton">
    Create Account
    <i class="fa-solid fa-arrow-right"></i>
</button>


            <!-- MESSAGE -->

            <p id="signupMessage" class="login-message"></p>


            <!-- LOGIN -->

            <p class="signup-text">

                Already have an account?

                <a href="login.html">Login</a>

            </p>


            <!-- BACK -->

            <a href="index.html" class="back-home">

                <i class="fa-solid fa-arrow-left"></i>

                Back to Home

            </a>

        </div>

    </div>


    <script type="module" src="script.js"></script>

</body>

</html>
