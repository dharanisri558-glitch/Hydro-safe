<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | HydroSafe</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="login-page">

    <!-- LOGIN CARD -->

    <div class="login-wrapper">

        <div class="login-card">

            <a href="index.html" class="login-logo">
                <img src="logo.jpeg" alt="HydroSafe">
                <h2>HydroSafe</h2>
            </a>

            <p class="login-label">WELCOME BACK</p>

            <h1>Login to HydroSafe</h1>

            <p class="login-description">
                Access your water analysis and explore personalized
                purification solutions.
            </p>


            <!-- EMAIL -->

            <div class="login-input">

                <i class="fa-solid fa-envelope"></i>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Email address"
                    required
                >

            </div>
>
             <!-- PASSWORD -->

<div class="login-input">
    <i class="fa-solid fa-lock"></i>

    <input
        type="password"
        id="loginPassword"
        placeholder="Password"
        required
    >

    <button
        type="button"
        class="password-toggle"
        id="loginPasswordToggle"
    >
        <i class="fa-solid fa-eye"></i>
    </button>
</div>

<!-- LOGIN BUTTON -->

<button
    class="login-button"
    id="loginButton"
    type="button"
>
    Login
    <i class="fa-solid fa-arrow-right"></i>
</button>
            <!-- MESSAGE -->

            <p id="loginMessage" class="login-message"></p>


            <!-- SIGNUP -->

            <p class="signup-text">

                Don't have an account?

                <a href="signup.html">Create Account</a>

            </p>


            <!-- BACK -->

            <a href="index.html" class="back-home">

                <i class="fa-solid fa-arrow-left"></i>

                Back to Home

            </a>

        </div>

    </div>


    <script type="module" src="script.js"></script>

</body>

</html>
